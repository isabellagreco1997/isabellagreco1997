<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Isa Greco — Software Engineer building games and AI</title>
  <desc id="desc">A cinematic game interface showing Isa Greco's engineering profile.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10172B"/>
      <stop offset=".48" stop-color="#172447"/>
      <stop offset="1" stop-color="#0C1223"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8EF6E4"/>
      <stop offset=".55" stop-color="#74A6F5"/>
      <stop offset="1" stop-color="#B98AF7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#8EF6E4" stop-opacity="0"/>
      <stop offset=".45" stop-color="#8EF6E4"/>
      <stop offset="1" stop-color="#B98AF7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#A4C4FF" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M0 271C200 230 318 316 508 276C710 233 852 169 1200 238V360H0V271Z" fill="#070B17" fill-opacity=".7"/>
  <path d="M0 287C227 242 338 325 526 284C730 239 889 187 1200 249" stroke="url(#line)" stroke-opacity=".55"/>
  <g opacity=".45">
    <circle cx="1005" cy="84" r="2" fill="#CFE6FF"/><circle cx="1111" cy="155" r="3" fill="#CFE6FF"/>
    <circle cx="922" cy="194" r="2" fill="#CFE6FF"/><circle cx="1082" cy="241" r="2" fill="#CFE6FF"/>
    <circle cx="831" cy="67" r="1.5" fill="#CFE6FF"/><circle cx="1164" cy="48" r="1.5" fill="#CFE6FF"/>
  </g>
  <g transform="translate(895 58)">
    <circle cx="120" cy="120" r="101" stroke="#9CBFFF" stroke-opacity=".16"/>
    <circle cx="120" cy="120" r="76" stroke="#9CBFFF" stroke-opacity=".18" stroke-dasharray="3 9"/>
    <path d="M120 22A98 98 0 0 1 214 89" stroke="#8EF6E4" stroke-width="2" filter="url(#glow)"/>
    <path d="M38 181A98 98 0 0 0 117 218" stroke="#B98AF7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="54" fill="url(#orb)" opacity=".91"/>
    <path d="M103 110L120 91L137 110L120 127L103 110ZM103 132L120 149L137 132" stroke="#081326" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 42V61M120 179V198M42 120H61M179 120H198" stroke="#D6F8F2" stroke-width="2"/>
  </g>
  <g font-family="monospace">
    <text x="62" y="60" fill="#8EF6E4" font-size="13" letter-spacing="3">PLAYER PROFILE / ENGINEERING</text>
    <text x="62" y="126" fill="#F6F8FF" font-size="50" font-weight="700" letter-spacing="-2">ISA GRECO</text>
    <text x="65" y="161" fill="#AFC2E7" font-size="19">Software engineer · game-maker · AI explorer</text>
    <rect x="62" y="194" width="392" height="1" fill="url(#line)"/>
    <text x="62" y="232" fill="#8EF6E4" font-size="14">CURRENT QUEST</text>
    <text x="62" y="262" fill="#E1E9FF" font-size="18">Building strange, playable things with code.</text>
    <rect x="62" y="292" width="160" height="34" rx="17" fill="#8EF6E4" fill-opacity=".12" stroke="#8EF6E4" stroke-opacity=".65"/>
    <circle cx="84" cy="309" r="5" fill="#8EF6E4" filter="url(#glow)"/>
    <text x="99" y="314" fill="#D9FFF8" font-size="12" letter-spacing="1">SYSTEM ONLINE</text>
  </g>
  <path d="M755 42v37h-37M792 42h37v37M755 318v-37h-37M792 318h37v-37" stroke="#9CBFFF" stroke-opacity=".45"/>
