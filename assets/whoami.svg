<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='290' viewBox='0 0 1200 290'><defs><pattern id='g' width='24' height='24' patternUnits='userSpaceOnUse'><path d='M24 0H0V24' fill='none' stroke='#16234a' stroke-width='1'/></pattern></defs><rect width='1200' height='290' fill='#0b1120'/><rect width='1200' height='290' fill='url(#g)'/><text x='36' y='44' font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' font-size='22' fill='#f5c542'>01</text><text x='88' y='44' font-family='SFMono-Regular,Menlo,Consolas,"Courier New",monospace' font-size='22' fill='#e8eefc' letter-spacing='2'>👾  WHOAMI.DAT</text><rect x='36' y='70' width='1128' height='196' fill='#0f1a33' stroke='#5cc8ff' stroke-width='3'/><rect x='32' y='66' width='8' height='8' fill='#f5c542'/><rect x='1160' y='262' width='8' height='8' fill='#f5c542'/><text x='60' y='112' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size='17' fill='#e8eefc'>I’m a UK-based Software Engineer with an unconventional origin story. I studied Game and Graphic Design at uni before making</text><text x='60' y='140' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size='17' fill='#e8eefc'>the jump into tech 8 years ago. That background means I don't just write code. I care deeply about the aesthetic, the mechanics,</text><text x='60' y='168' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size='17' fill='#e8eefc'>and the pixel-perfect details.</text><text x='60' y='224' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size='17' fill='#e8eefc'>Right now, I’m exploring the intersection of web development, 3D rendering, and generative AI. Whether I'm building interactive</text><text x='60' y='252' font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size='17' fill='#e8eefc'>visual novels, crafting 16-bit RPG interfaces, or automating workflows, I build things that look good and run fast.</text></svg>